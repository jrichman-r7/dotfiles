# AeroSpace config — i3/ratpoison flavor
# Docs: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

# Run on startup
after-login-command = []
after-startup-command = [
    # 'exec-and-forget sketchybar'   # uncomment when you add sketchybar
]

# Normalizations help i3-style trees stay sane
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Layout defaults
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# macOS-quirk: don't follow native focus, aerospace decides
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = true

# Gaps (set to 0 if you want tight)
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

# === Main mode keybinds (alt-prefix, i3-style) ===
[mode.main.binding]

# Layout switching
alt-slash = 'layout tiles horizontal vertical'   # toggle tile orientation
alt-comma = 'layout accordion horizontal vertical'

# Focus (h/j/k/l, vim-style)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize (i3: mod+r enters resize mode; here: direct binds)
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Workspaces 1-9
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move focused window to workspace N
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Toggle back-and-forth between last two workspaces
alt-tab = 'workspace-back-and-forth'

# Move workspace to another monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Fullscreen
alt-f = 'fullscreen'

# Float/unfloat (for apps that resist tiling)
alt-shift-space = 'layout floating tiling'

# Enter service/resize/etc. mode
alt-shift-semicolon = 'mode service'

# Reload config without restart
alt-shift-c = 'reload-config'

# === Service mode (i3 "$mod+Shift" admin actions) ===
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']   # reset workspace tree
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Join window into container direction
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

